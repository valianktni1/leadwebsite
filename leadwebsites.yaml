name: leadwebsites
services:
  leadwebsites:
    container_name: leadwebsites
    build:
      context: "https://github.com/valianktni1/leadwebsite.git#main"
    restart: unless-stopped
    ports:
      - "30065:3000"
    environment:
      PUBLIC_URL: https://websites.ivorydigital.uk
      DATA_DIR: /data
      CONFIG_DIR: /config
      PORT: "3000"
    volumes:
      - /mnt/photographers_data/leadwebsitedemos:/data
      - /mnt/apps/leadwebsite/config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
